# =====================================================
# Deploy Automático via Tags
# =====================================================
# Fluxo:
# 1. Desenvolve na branch feature/*
# 2. Merge para master
# 3. Cria tag: git tag -a v1.0.0 -m "Release 1.0.0"
# 4. Push da tag: git push origin v1.0.0
# 5. GitHub Actions detecta e faz deploy no servidor
# =====================================================

name: Deploy Production

on:
  push:
    tags:
      - 'v*'  # Dispara em tags como v1.0.0, v1.0.1, etc.

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # =====================================================
  # Job 1: Build e Push da Imagem Docker
  # =====================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =====================================================
  # Job 2: Deploy no Servidor via SSH
  # =====================================================
  deploy:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e

            echo "=== Deploy Smart Core Assistant v${{ needs.build.outputs.version }} ==="

            # Navegar para o diretório do projeto
            cd ~/smart-core-assistant-painel

            # Pull das últimas alterações
            git fetch --tags
            git checkout ${{ github.ref_name }}

            # Pull da nova imagem
            echo "Pulling new Docker image..."
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.version }}

            # Recriar containers com a nova imagem
            echo "Recreating containers..."
            docker compose -f docker/compose/app.yml pull
            docker compose -f docker/compose/workers.yml pull

            # Restart dos serviços (sem downtime para data stack)
            docker compose -f docker/compose/app.yml up -d --force-recreate
            docker compose -f docker/compose/workers.yml up -d --force-recreate

            # Verificar saúde dos containers
            echo "Checking container health..."
            sleep 10
            docker compose -f docker/compose/app.yml ps
            docker compose -f docker/compose/workers.yml ps

            echo "=== Deploy completed successfully! ==="

      - name: Notify Success
        if: success()
        run: |
          echo "✅ Deploy da versão ${{ needs.build.outputs.version }} concluído com sucesso!"

      - name: Notify Failure
        if: failure()
        run: |
          echo "❌ Falha no deploy da versão ${{ needs.build.outputs.version }}"
          exit 1
