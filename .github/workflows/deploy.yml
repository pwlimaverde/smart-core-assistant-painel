# =====================================================
# Deploy Automático via Tags
# =====================================================
# Fluxo:
# 1. Desenvolve na branch feature/*
# 2. Merge para master
# 3. Cria tag: git tag -a v1.0.0 -m "Release 1.0.0"
# 4. Push da tag: git push origin v1.0.0
# 5. GitHub Actions detecta e faz deploy no servidor
# =====================================================

name: Deploy Production

on:
  push:
    tags:
      - 'v*'  # Dispara em tags como v1.0.0, v1.0.1, etc.

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  COMPOSE_PROJECT_DATA: smart-core-data
  COMPOSE_PROJECT_APP: smart-core-app
  COMPOSE_PROJECT_WORKERS: smart-core-workers
  COMPOSE_PROJECT_INFRA: smart-core-infra

jobs:
  # =====================================================
  # Job 1: Build e Push da Imagem Docker
  # =====================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =====================================================
  # Job 2: Deploy no Servidor via SSH
  # =====================================================
  deploy:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -e

            echo "=== Deploy Smart Core Assistant v${{ needs.build.outputs.version }} ==="

            # Navegar para o diretório do projeto
            cd ~/smart-core-assistant-painel

            # Pull das últimas alterações (--force sobrescreve tags locais)
            git fetch --tags --force
            git checkout ${{ github.ref_name }}

            # Define imagem/tag para o Docker Compose
            export SMARTCORE_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
            export SMARTCORE_IMAGE_TAG="${{ needs.build.outputs.version }}"

            # Garante arquivo de ambiente de produção no servidor
            if [ ! -f .env.prod ]; then
              echo "❌ Arquivo .env.prod não encontrado em ~/smart-core-assistant-painel"
              exit 1
            fi

            # Login no GHCR para pull de imagens privadas
            echo "$GHCR_TOKEN" | docker login ${{ env.REGISTRY }} -u "$GHCR_USERNAME" --password-stdin

            # Pull da nova imagem
            echo "Pulling new Docker image..."
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.version }}

            # Recriar containers com a nova imagem
            echo "Recreating containers..."
            SMARTCORE_ENV_FILE=.env.prod docker compose --env-file .env.prod -p ${{ env.COMPOSE_PROJECT_APP }} -f docker/compose/app.yml pull
            SMARTCORE_ENV_FILE=.env.prod docker compose --env-file .env.prod -p ${{ env.COMPOSE_PROJECT_WORKERS }} -f docker/compose/workers.yml pull

            # Migrações como job efêmero (não deixa container "exited" no stack)
            # Imagem GHCR já disponível via pull acima
            SMARTCORE_ENV_FILE=.env.prod docker compose --env-file .env.prod -p ${{ env.COMPOSE_PROJECT_APP }} -f docker/compose/app.yml run --rm migrate

            # Restart dos serviços (sem downtime para data stack)
            # --no-build impede rebuild local, forçando uso da imagem GHCR pullada
            SMARTCORE_ENV_FILE=.env.prod docker compose --env-file .env.prod -p ${{ env.COMPOSE_PROJECT_APP }} -f docker/compose/app.yml up -d --force-recreate --no-build django_app
            SMARTCORE_ENV_FILE=.env.prod docker compose --env-file .env.prod -p ${{ env.COMPOSE_PROJECT_WORKERS }} -f docker/compose/workers.yml up -d --force-recreate --no-build

            # Coletar estáticos para garantir CSS/JS do admin em produção
            docker exec smartcoreassistant_app python -m smart_core_assistant_painel.app.ui.manage collectstatic --noinput

            # Verificar saúde dos containers
            echo "Checking container health..."
            sleep 10
            SMARTCORE_ENV_FILE=.env.prod docker compose --env-file .env.prod -p ${{ env.COMPOSE_PROJECT_APP }} -f docker/compose/app.yml ps
            SMARTCORE_ENV_FILE=.env.prod docker compose --env-file .env.prod -p ${{ env.COMPOSE_PROJECT_WORKERS }} -f docker/compose/workers.yml ps

            echo "=== Deploy completed successfully! ==="

      - name: Notify Success
        if: success()
        run: |
          echo "✅ Deploy da versão ${{ needs.build.outputs.version }} concluído com sucesso!"

      - name: Notify Failure
        if: failure()
        run: |
          echo "❌ Falha no deploy da versão ${{ needs.build.outputs.version }}"
          exit 1
