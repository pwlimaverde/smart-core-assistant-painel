version: '3.8'

# ============================================
# AMBIENTE DE TESTE LOCAL - Smart Core Assistant
# ============================================
# Usar com servidor Docker em 192.168.3.127
# ============================================

services:
  # ============================================
  # AMBIENTE CLIENTE - Sistema Django
  # ============================================

  # ============================================
  # PostgreSQL do CLIENTE (Sistema Django)
  # ============================================
  postgres_cliente:
    image: pgvector/pgvector:pg16
    container_name: smartcore_cliente_postgres_teste
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartcore_cliente_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
    volumes:
      - postgres_cliente_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5436}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================
  # Redis do CLIENTE (Django cache/filas)
  # ============================================
  redis_cliente:
    image: redis:7-alpine
    container_name: smartcore_cliente_redis_teste
    command: redis-server --appendonly yes
    volumes:
      - redis_cliente_data:/data
    ports:
      - "${REDIS_PORT:-6382}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================
  # AMBIENTE EVOLUTION - WhatsApp API
  # ============================================

  # ============================================
  # PostgreSQL do EVOLUTION (WhatsApp API)
  # ============================================
  postgres_evolution:
    image: postgres:16-alpine
    container_name: smartcore_evolution_postgres_teste
    environment:
      POSTGRES_DB: ${EVOLUTION_POSTGRES_DB:-smartcore_evolution_db}
      POSTGRES_USER: ${EVOLUTION_POSTGRES_USER:-evolution}
      POSTGRES_PASSWORD: ${EVOLUTION_POSTGRES_PASSWORD:-evolution123}
    volumes:
      - postgres_evolution_data:/var/lib/postgresql/data
    ports:
      - "${EVOLUTION_POSTGRES_PORT:-5437}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${EVOLUTION_POSTGRES_USER:-evolution}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================
  # Redis do EVOLUTION (cache WhatsApp)
  # ============================================
  redis_evolution:
    image: redis:7-alpine
    container_name: smartcore_evolution_redis_teste
    # [RESILIÊNCIA] --appendonly yes garante que a fila de webhooks seja salva em disco.
    # Se o servidor cair, as mensagens pendentes não são perdidas.
    command: redis-server --appendonly yes
    volumes:
      - redis_evolution_data:/data
    ports:
      - "${EVOLUTION_REDIS_PORT:-6383}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================
  # Evolution API para WhatsApp
  # ============================================
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: smartcore_evolution_teste
    environment:
      # Configurações básicas
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://192.168.3.127:8080}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-chave-teste-local-smartcore-2024}

      # Banco de dados DEDICADO (postgres_evolution)
      DATABASE_ENABLED: true
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${EVOLUTION_POSTGRES_USER:-evolution}:${EVOLUTION_POSTGRES_PASSWORD:-evolution123}@postgres_evolution:5432/${EVOLUTION_POSTGRES_DB:-smartcore_evolution_db}
      DATABASE_SAVE_DATA_INSTANCE: true
      DATABASE_SAVE_DATA_NEW_MESSAGE: false
      DATABASE_SAVE_MESSAGE_UPDATE: false
      DATABASE_SAVE_DATA_CONTACTS: false
      DATABASE_SAVE_DATA_CHATS: false
      DATABASE_SAVE_DATA_LABELS: false
      DATABASE_SAVE_DATA_HISTORIC: false

      # Redis DEDICADO (redis_evolution)
      # [RESILIÊNCIA] O Redis gerencia a fila de entrega.
      # Se o seu backend (Django) estiver offline, o Evolution tentará reenviar (Retry)
      # automaticamente por um período, graças ao BullMQ rodando no Redis.
      CACHE_REDIS_ENABLED: ${CACHE_REDIS_ENABLED:-true}
      CACHE_REDIS_URI: ${CACHE_REDIS_URI:-redis://redis_evolution:6379/0}
      CACHE_REDIS_TTL: ${CACHE_REDIS_TTL:-604800}
      CACHE_REDIS_PREFIX_KEY: ${CACHE_REDIS_PREFIX_KEY:-evolution}
      CACHE_REDIS_SAVE_INSTANCES: ${CACHE_REDIS_SAVE_INSTANCES:-false}
      CACHE_LOCAL_ENABLED: ${CACHE_LOCAL_ENABLED:-false}

      # Webhook para o Core (Django local)
      WEBHOOK_GLOBAL_URL: ${WEBHOOK_CORE_URL:-http://192.168.3.90:8000/sync/evolution/webhook/}
      WEBHOOK_GLOBAL_ENABLED: true
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: false
      
      # Eventos Webhook (Otimizado para Stateless)
      WEBHOOK_EVENTS_APPLICATION_STARTUP: false
      WEBHOOK_EVENTS_QRCODE_UPDATED: true
      WEBHOOK_EVENTS_MESSAGES_SET: false
      WEBHOOK_EVENTS_MESSAGES_UPSERT: true
      WEBHOOK_EVENTS_MESSAGES_UPDATE: false
      WEBHOOK_EVENTS_MESSAGES_DELETE: false
      WEBHOOK_EVENTS_SEND_MESSAGE: false
      WEBHOOK_EVENTS_CONTACTS_SET: false
      WEBHOOK_EVENTS_CONTACTS_UPSERT: false
      WEBHOOK_EVENTS_CONTACTS_UPDATE: false
      WEBHOOK_EVENTS_PRESENCE_UPDATE: false
      WEBHOOK_EVENTS_CHATS_SET: false
      WEBHOOK_EVENTS_CHATS_UPSERT: false
      WEBHOOK_EVENTS_CHATS_UPDATE: false
      WEBHOOK_EVENTS_CHATS_DELETE: false
      WEBHOOK_EVENTS_GROUPS_UPSERT: false
      WEBHOOK_EVENTS_GROUPS_UPDATE: false
      WEBHOOK_EVENTS_GROUP_PARTICIPANTS_UPDATE: false
      WEBHOOK_EVENTS_CONNECTION_UPDATE: true

      # QR Code
      QRCODE_LIMIT: ${QRCODE_LIMIT:-30}
      QRCODE_COLOR: "${QRCODE_COLOR:-#198754}"

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-WARN}
      LOG_COLOR: ${LOG_COLOR:-true}
      LOG_BAILEYS: ${LOG_BAILEYS:-error}
    ports:
      - "${EVOLUTION_PORT:-8080}:8080"
    depends_on:
      postgres_evolution:
        condition: service_healthy
      redis_evolution:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # Volumes do Cliente (Django)
  postgres_cliente_data:
  redis_cliente_data: # Volumes do Evolution

  postgres_evolution_data:
  redis_evolution_data:
