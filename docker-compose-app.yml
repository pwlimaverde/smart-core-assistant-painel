services:
  # ============================================
  # Django App (Aplicação Principal)
  # ============================================
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartcoreassistant_migrate
    command: python -m smart_core_assistant_painel.app.ui.manage migrate
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=smart_core_assistant_painel.app.ui.core.settings
      - PYTHONPATH=/app/src
      - POSTGRES_HOST=smartcoreassistant_postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=smartcoreassistant_redis
      - REDIS_PORT=6379
      - TENANT_BASE_DOMAIN=${TENANT_BASE_DOMAIN:-smartcoreassistant.com.br}
    networks:
      - default
    restart: "no"

  django_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartcoreassistant_app
    command: >
      python -m smart_core_assistant_painel.main runserver 0.0.0.0:8000
    volumes:
      - static_files:/app/src/smart_core_assistant_painel/app/ui/staticfiles
      - media_files:/app/src/smart_core_assistant_painel/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=smart_core_assistant_painel.app.ui.core.settings
      - PYTHONPATH=/app/src
      - POSTGRES_HOST=smartcoreassistant_postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=smartcoreassistant_redis
      - REDIS_PORT=6379
      - TENANT_BASE_DOMAIN=${TENANT_BASE_DOMAIN:-smartcoreassistant.com.br}
    develop:
      watch:
        - action: sync
          path: ./src/smart_core_assistant_painel
          target: /app/src/smart_core_assistant_painel
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - default
    restart: unless-stopped

  # ============================================
  # Celery Worker (Processamento Assíncrono)
  # ============================================
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartcoreassistant_celery_worker
    command: >
      celery -A smart_core_assistant_painel.app.ui.core worker --loglevel=INFO --concurrency=3 --queues=webhooks,ai_processing,default --hostname=worker@%h
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=smart_core_assistant_painel.app.ui.core.settings
      - PYTHONPATH=/app/src
      - POSTGRES_HOST=smartcoreassistant_postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=smartcoreassistant_redis
      - REDIS_PORT=6379
      - TENANT_BASE_DOMAIN=${TENANT_BASE_DOMAIN:-smartcoreassistant.com.br}
    volumes: []
    develop:
      watch:
        - action: sync+restart
          path: ./src/smart_core_assistant_painel
          target: /app/src/smart_core_assistant_painel
    depends_on:
      django_app:
        condition: service_started
    networks:
      - default
    restart: unless-stopped
    # Limita recursos para evitar OOM
    deploy:
      resources:
        limits:
          memory: 1536M

  # ============================================
  # Celery Beat (Scheduler de Tasks Periódicas)
  # ============================================
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartcoreassistant_celery_beat
    command: >
      celery -A smart_core_assistant_painel.app.ui.core beat --loglevel=INFO --scheduler=django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=smart_core_assistant_painel.app.ui.core.settings
      - PYTHONPATH=/app/src
      - POSTGRES_HOST=smartcoreassistant_postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=smartcoreassistant_redis
      - REDIS_PORT=6379
      - TENANT_BASE_DOMAIN=${TENANT_BASE_DOMAIN:-smartcoreassistant.com.br}
    volumes: []
    develop:
      watch:
        - action: sync+restart
          path: ./src/smart_core_assistant_painel
          target: /app/src/smart_core_assistant_painel
    depends_on:
      django_app:
        condition: service_started
    networks:
      - default
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # ============================================
  # Flower (OPCIONAL - Apenas para Debug)
  # ============================================
  flower:
    image: mher/flower:2.0
    container_name: smartcoreassistant_flower
    profiles:
      - debug # Só sobe com: docker compose --profile debug up flower
    environment:
      - CELERY_BROKER_URL=redis://smartcoreassistant_redis:6379/0
      - FLOWER_BASIC_AUTH=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin123}
      - FLOWER_PURGE_OFFLINE_WORKERS=60
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    networks:
      - default
    restart: unless-stopped

  # ============================================
  # Cloudflare Tunnel
  # ============================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: smartcoreassistant_tunnel
    restart: unless-stopped
    command: tunnel run --protocol ${CLOUDFLARE_TUNNEL_PROTOCOL:-http2}
    env_file:
      - .env
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:?Defina CLOUDFLARE_TUNNEL_TOKEN no .env}
    depends_on:
      django_app:
        condition: service_started
    networks:
      - default

volumes:
  static_files:
  media_files:

networks:
  default:
    name: smartcore-network
    external: true
