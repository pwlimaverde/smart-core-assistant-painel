services:
  # ============================================
  # PostgreSQL Core (Metadados SaaS)
  # ============================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smartcoreassistant_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_core_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5438}:5432"
    volumes:
      - postgres_core_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartcore-network
    restart: unless-stopped

  # ============================================
  # Redis Core (Cache & Queues)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: smartcoreassistant_redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PUBLISH_PORT:-6384}:6379"
    volumes:
      - redis_core_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartcore-network
    restart: unless-stopped

volumes:
  postgres_core_data:
    name: smartcoreassistant_postgres_data
  redis_core_data:
    name: smartcoreassistant_redis_data

networks:
  smartcore-network:
    name: smartcore-network
    driver: bridge
