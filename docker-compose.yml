version: '3.8'
services:
  postgres:
    image: pgvector/pgvector:pg14
    container_name: postgres_db_jules
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data_jules:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:6.2-alpine
    container_name: redis_cache_jules
    ports:
      - "${REDIS_PORT}:6379"
    restart: unless-stopped

volumes:
  postgres_data_jules:
    name: postgres_data_jules
