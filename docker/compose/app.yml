services:
  # ============================================
  # Django App (Aplicação Principal)
  # ============================================
  migrate:
    image: "${SMARTCORE_IMAGE:-ghcr.io/pwlimaverde/smart-core-assistant-painel}:${SMARTCORE_IMAGE_TAG:-latest}"
    build:
      context: ../../
      dockerfile: docker/Dockerfile
    container_name: smartcoreassistant_migrate
    command: python -m smart_core_assistant_painel.app.manage migrate
    env_file:
      - ../../${SMARTCORE_ENV_FILE:-.env}
    environment:
      - DJANGO_SETTINGS_MODULE=smart_core_assistant_painel.app.core.settings
      - PYTHONPATH=/app/src
      - POSTGRES_HOST=smartcoreassistant_postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=smartcoreassistant_redis
      - REDIS_PORT=6379
      - TENANT_BASE_DOMAIN=${TENANT_BASE_DOMAIN:-smartcoreassistant.com.br}
    networks:
      - shared_network
    restart: "no"

  django_app:
    image: "${SMARTCORE_IMAGE:-ghcr.io/pwlimaverde/smart-core-assistant-painel}:${SMARTCORE_IMAGE_TAG:-latest}"
    build:
      context: ../../
      dockerfile: docker/Dockerfile
    container_name: smartcoreassistant_app
    command: >
      gunicorn smart_core_assistant_painel.app.core.wsgi:application
      --bind 0.0.0.0:8000
      --workers=${GUNICORN_WORKERS:-3}
      --timeout=${GUNICORN_TIMEOUT:-120}
    volumes:
      - static_files:/app/src/smart_core_assistant_painel/app/staticfiles
      - media_files:/app/src/smart_core_assistant_painel/app/media
    ports:
      - "8000:8000"
    env_file:
      - ../../${SMARTCORE_ENV_FILE:-.env}
    environment:
      - DJANGO_SETTINGS_MODULE=smart_core_assistant_painel.app.core.settings
      - PYTHONPATH=/app/src
      - POSTGRES_HOST=smartcoreassistant_postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=smartcoreassistant_redis
      - REDIS_PORT=6379
      - TENANT_BASE_DOMAIN=${TENANT_BASE_DOMAIN:-smartcoreassistant.com.br}
    develop:
      watch:
        - action: sync
          path: ./src/smart_core_assistant_painel
          target: /app/src/smart_core_assistant_painel
    networks:
      - shared_network
    restart: unless-stopped

volumes:
  static_files:
    name: smartcore_static_files
  media_files:
    name: smartcore_media_files

networks:
  shared_network:
    name: shared_network
    external: true
