services:
  # ============================================
  # Cloudflare Tunnel (Exposição Segura)
  # Configurar rotas no Dashboard Cloudflare Zero Trust:
  # - painel.dominio.com -> http://smartcoreassistant_app:8000
  # - evolution.dominio.com -> http://evolution_api:8080 (futuro)
  # ============================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: smartcoreassistant_tunnel
    profiles:
      - deprecated
    restart: unless-stopped
    command: tunnel run --protocol ${CLOUDFLARE_TUNNEL_PROTOCOL:-http2}
    env_file:
      - ../../${SMARTCORE_ENV_FILE:-.env}
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:?Defina CLOUDFLARE_TUNNEL_TOKEN no .env}
    networks:
      - shared_network

  # ============================================
  # Flower (OPCIONAL - Monitoramento Celery)
  # Uso: docker compose --profile debug up flower
  # ============================================
  flower:
    image: mher/flower:2.0
    container_name: smartcoreassistant_flower
    profiles:
      - debug
    env_file:
      - ../../${SMARTCORE_ENV_FILE:-.env}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - FLOWER_BASIC_AUTH=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin123}
      - FLOWER_PURGE_OFFLINE_WORKERS=60
    command: >
      sh -c 'BROKER_URL="redis://smartcoreassistant_redis:6379/0";
      if [ -n "$$REDIS_PASSWORD" ]; then
      BROKER_URL="redis://:$$REDIS_PASSWORD@smartcoreassistant_redis:6379/0";
      fi;
      exec celery --broker="$$BROKER_URL" flower --port=5555'
    ports:
      - target: 5555
        published: "${FLOWER_PORT:-5555}"
        host_ip: "${FLOWER_PUBLISH_HOST:-127.0.0.1}"
    networks:
      - shared_network
    restart: unless-stopped

networks:
  shared_network:
    name: shared_network
    external: true
