services:
  # ============================================
  # Caddy (Reverse Proxy + SSL Automático)
  # ============================================
  caddy:
    image: caddy:2-alpine
    container_name: smartcoreassistant_caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # Habilita suporte HTTP/3
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - static_files:/var/www/static:ro
      # Montado em protected-media para servir URLs reescritas de X-Accel-Redirect
      - media_files:/var/www/protected-media:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - shared_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  caddy_data:
    name: smartcore_caddy_data
  caddy_config:
    name: smartcore_caddy_config
  static_files:
    name: smartcore_static_files
    external: true
  media_files:
    name: smartcore_media_files
    external: true

networks:
  shared_network:
    name: shared_network
    external: true
