services:
  # ============================================
  # Celery Worker (Processamento Assíncrono)
  # ============================================
  celery_worker:
    image: "${SMARTCORE_IMAGE:-ghcr.io/pwlimaverde/smart-core-assistant-painel}:${SMARTCORE_IMAGE_TAG:-latest}"
    build:
      context: ../../
      dockerfile: docker/Dockerfile
    container_name: smartcoreassistant_celery_worker
    command: >
      celery -A smart_core_assistant_painel.app.core worker
      --loglevel=INFO --concurrency=${CELERY_CONCURRENCY:-3}
      --queues=webhooks,ai_processing,default --hostname=worker@%h
    env_file:
      - ../../${SMARTCORE_ENV_FILE:-.env}
    environment:
      - DJANGO_SETTINGS_MODULE=smart_core_assistant_painel.app.core.settings
      - PYTHONPATH=/app/src
      - POSTGRES_HOST=smartcoreassistant_postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=smartcoreassistant_redis
      - REDIS_PORT=6379
      - TENANT_BASE_DOMAIN=${TENANT_BASE_DOMAIN:-smartcoreassistant.com.br}
    healthcheck:
      test: ["CMD-SHELL", "celery -A smart_core_assistant_painel.app.core inspect ping --timeout 10 2>/dev/null | grep -q 'pong' || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    volumes: []
    develop:
      watch:
        - action: sync+restart
          path: ./src/smart_core_assistant_painel
          target: /app/src/smart_core_assistant_painel
    networks:
      - shared_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1536M

  # ============================================
  # Celery Beat (Scheduler de Tasks Periódicas)
  # ============================================
  celery_beat:
    image: "${SMARTCORE_IMAGE:-ghcr.io/pwlimaverde/smart-core-assistant-painel}:${SMARTCORE_IMAGE_TAG:-latest}"
    build:
      context: ../../
      dockerfile: docker/Dockerfile
    container_name: smartcoreassistant_celery_beat
    command: >
      celery -A smart_core_assistant_painel.app.core beat
      --loglevel=INFO --scheduler=django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - ../../${SMARTCORE_ENV_FILE:-.env}
    environment:
      - DJANGO_SETTINGS_MODULE=smart_core_assistant_painel.app.core.settings
      - PYTHONPATH=/app/src
      - POSTGRES_HOST=smartcoreassistant_postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=smartcoreassistant_redis
      - REDIS_PORT=6379
      - TENANT_BASE_DOMAIN=${TENANT_BASE_DOMAIN:-smartcoreassistant.com.br}
    volumes: []
    develop:
      watch:
        - action: sync+restart
          path: ./src/smart_core_assistant_painel
          target: /app/src/smart_core_assistant_painel
    networks:
      - shared_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  shared_network:
    name: shared_network
    external: true
