# ============================================
# Upstream: Django App
# ============================================
upstream django {
    server smartcoreassistant_app:8000;
}

# ============================================
# HTTP → HTTPS Redirect (porta 80)
# ============================================
server {
    listen 80;
    listen [::]:80;
    server_name smartcoreassistant.com.br *.smartcoreassistant.com.br;

    # Certbot ACME challenge (HTTP-01 fallback)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect tudo para HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================
# HTTPS www → Redirect para raiz
# ============================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.smartcoreassistant.com.br;

    include /etc/nginx/snippets/ssl-params.conf;

    return 301 https://smartcoreassistant.com.br$request_uri;
}

# ============================================
# HTTPS Principal (raiz + app + wildcard tenants)
# Django cuida do routing interno
# ============================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name smartcoreassistant.com.br *.smartcoreassistant.com.br;

    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;

    # Arquivos estáticos Django (servidos diretamente pelo Nginx)
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Arquivos de mídia Django (servidos diretamente pelo Nginx)
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Favicon
    location = /favicon.ico {
        alias /var/www/static/img/logo_smart.png;
        access_log off;
        log_not_found off;
    }

    # Proxy para Django (todas as rotas dinâmicas)
    location / {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://django;
    }
}
