{# Partial usado dentro de <template x-for="m in messages">. Recebe `m`.
   Bolhas WhatsApp-style com tokens do design system + suporte a mídia. #}
<div :class="m.remetente === 'contato' ? 'ws-bub ws-bub--in' : 'ws-bub ws-bub--out'">

    {# ============ IMAGEM ============ #}
    <template x-if="m.media && m.media.kind === 'image' && m.media.src">
        <a :href="m.media.src" target="_blank" rel="noopener" class="ws-img">
            <img :src="m.media.src" :alt="m.media.filename || 'imagem'" />
        </a>
    </template>

    {# ============ ÁUDIO ============ #}
    {# Mantemos a tag nativa <audio> — confiável e acessível. Para um waveform
       custom, substitua este bloco por um componente Alpine. #}
    <template x-if="m.media && m.media.kind === 'audio' && m.media.src">
        <div :class="m.remetente === 'contato' ? 'ws-aud' : 'ws-aud ws-aud--out'">
            <audio controls preload="metadata" :src="m.media.src" style="max-width:240px; width:100%;"></audio>
        </div>
    </template>

    {# ============ VÍDEO ============ #}
    <template x-if="m.media && m.media.kind === 'video' && m.media.src">
        <video controls preload="metadata" :src="m.media.src"
            class="ws-img" style="max-width: 280px;"></video>
    </template>

    {# ============ DOCUMENTO ============ #}
    <template x-if="m.media && m.media.kind === 'document'">
        <a :href="m.media.src || '#'" :download="m.media.filename" class="ws-doc"
            :class="m.media.src ? '' : 'pointer-events-none opacity-70'">
            <div class="ws-doc__ico"
                x-text="(m.media.filename || 'PDF').split('.').pop().toUpperCase().slice(0, 4)"></div>
            <div class="ws-doc__info">
                <div class="ws-doc__name" x-text="m.media.filename || 'documento'"></div>
                <div class="ws-doc__size" x-text="m.media.size_label || ''"></div>
            </div>
            <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6"
                style="color: var(--ws-fg-muted);">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v12m0 0l-4-4m4 4l4-4M5 20h14"/>
            </svg>
        </a>
    </template>

    {# ============ FALLBACK: mídia sem src (sem base64 disponível) ============ #}
    <template x-if="m.media && !m.media.src && m.media.kind !== 'document'">
        <div style="font-size: 11px; font-style: italic; color: var(--ws-fg-muted); margin-bottom: 4px;">
            <span x-text="tipoMidiaLabel(m.tipo)"></span>
            <span style="color: var(--ws-fg-subtle);">— pré-visualização indisponível</span>
        </div>
    </template>

    {# ============ TEXTO / CAPTION ============ #}
    <template x-if="(m.remetente === 'contato' ? m.conteudo : (m.resposta_bot || m.conteudo))">
        <div class="ws-bub__txt"
            x-text="m.remetente === 'contato' ? m.conteudo : (m.resposta_bot || m.conteudo)"></div>
    </template>

    {# ============ RODAPÉ (timestamp + status) ============ #}
    <div class="ws-bub__foot">
        <span x-text="m.timestamp ? new Date(m.timestamp).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}) : ''"></span>
        <template x-if="m.remetente !== 'contato'">
            <span class="ws-bub__check"
                :class="m.respondida ? 'ws-bub__check--read' : ''"
                x-text="m.respondida ? '✓✓' : '✓'"></span>
        </template>
    </div>
</div>
