[package]
name = "django_sync_provider"
version = "0.1.0"
edition = "2021"
description = "Provider de sincronização (AppFlowy ↔ Django adapter)."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
reqwest = { version = "0.11", features = ["json", "blocking", "native-tls"] }
directories = "5.0"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
rand = "0.8"