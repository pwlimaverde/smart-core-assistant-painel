[package]
name = "django_sync_provider"
version = "0.1.0"
edition = "2021"
description = "Provider de sincronização (AppFlowy ↔ Django adapter)."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
reqwest = { version = "0.11", features = ["json", "blocking", "native-tls"] }
directories = "5.0"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
rand = "0.8"

[features]
# Habilita persistência segura de tokens (Windows DPAPI).
secure_tokens = ["windows"]

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", optional = true, features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
    "Win32_System_Memory",
] }