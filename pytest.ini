[pytest]
# Mantém cobertura ampla e verbosidade elevada (sem barras de continuação)
addopts = --cov-config=.coveragerc --cov=smart_core_assistant_painel --cov-report=html:tests/htmlcov --cov-report=term-missing -x -vv --import-mode=importlib --ignore=tests/app/notion_sync --ignore=src/smart_core_assistant_painel/app/trello_sync --ignore=test_mapper_simples.py --ignore=test_mensagens_relacionamento.py --ignore=tests/modules/ai_engine/features/analise_previa_mensagem/datasource/langchain_pydantic

# Diretórios alvo explícitos para coleta de testes
testpaths =
    tests
    src/smart_core_assistant_painel/app

# Configura settings de teste do Django
env =
    DJANGO_SETTINGS_MODULE=smart_core_assistant_painel.app.core.settings_test

# Silencia avisos despejados pelo pytest e dependências
filterwarnings =
    ignore::pytest.PytestConfigWarning
    ignore::DeprecationWarning
    ignore::UserWarning

# Comentário: Ignoramos explicitamente a suíte do Notion e testes de apoio
# localizados na raiz para não interferirem na nova implementação.
# Também ignoramos a suíte do Trello durante a migração para ClickUp.