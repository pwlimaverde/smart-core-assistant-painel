[pytest]
# Mantém cobertura ampla e verbosidade elevada
addopts = --cov-config=.coveragerc --cov=smart_core_assistant_painel \
    --cov-report=html:tests/htmlcov --cov-report term-missing -x -vv \
    --ignore=tests/app/notion_sync --ignore=test_mapper_simples.py \
    --ignore=test_mensagens_relacionamento.py

# Configura settings de teste do Django
env =
    DJANGO_SETTINGS_MODULE=smart_core_assistant_painel.app.ui.core.settings_test

# Silencia avisos despejados pelo pytest e dependências
filterwarnings =
    ignore::pytest.PytestConfigWarning
    ignore::DeprecationWarning
    ignore::UserWarning

# Comentário: Ignoramos explicitamente a suíte do Notion e testes de apoio
# localizados na raiz para não interferirem na nova implementação.