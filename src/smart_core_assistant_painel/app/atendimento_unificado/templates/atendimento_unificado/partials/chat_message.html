{# Partial usado dentro de <template x-for="m in messages">. Recebe `m`. #}
<div class="flex" :class="m.remetente === 'contato' ? 'justify-start' : 'justify-end'">
    <div class="max-w-[70%]">
        <div class="px-3 py-2 rounded-2xl text-sm whitespace-pre-wrap break-words"
            :class="m.remetente === 'contato'
                ? 'bg-stone-100 text-stone-800 rounded-tl-sm'
                : 'bg-[#a98f71]/10 text-stone-800 rounded-tr-sm'">
            <template x-if="m.tipo !== 'extendedTextMessage' && m.tipo !== 'conversation'">
                <div class="text-[10px] font-semibold uppercase tracking-wider text-stone-500 mb-1"
                    x-text="tipoMidiaLabel(m.tipo)"></div>
            </template>
            <span x-text="m.remetente === 'contato' ? m.conteudo : (m.resposta_bot || m.conteudo)"></span>
        </div>
        <div class="text-[10px] text-stone-400 mt-0.5"
            :class="m.remetente === 'contato' ? 'text-left' : 'text-right'">
            <span x-text="m.timestamp ? new Date(m.timestamp).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}) : ''"></span>
            <template x-if="m.remetente !== 'contato'">
                <span class="ml-1" x-text="m.respondida ? '✓✓' : '✓'"></span>
            </template>
        </div>
    </div>
</div>
