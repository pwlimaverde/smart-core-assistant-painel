{# Partial usado dentro de <template x-for="m in messages">. Recebe `m`. #}
<div class="flex" :class="m.remetente === 'contato' ? 'justify-start' : 'justify-end'">
    <div class="max-w-[88%]">
        <div class="px-3 py-2 rounded-2xl text-sm whitespace-pre-wrap break-words shadow-sm"
            :class="m.remetente === 'contato'
                ? 'bg-white text-stone-800 rounded-tl-sm'
                : 'bg-[#dcf8c6] text-stone-800 rounded-tr-sm'">

            {# ============ MÍDIA INLINE ============ #}
            <template x-if="m.media && m.media.kind === 'image' && m.media.src">
                <a :href="m.media.src" target="_blank" rel="noopener" class="block mb-1">
                    <img :src="m.media.src" :alt="m.media.filename || 'imagem'"
                        class="rounded-lg max-h-72 w-auto object-contain bg-stone-100" />
                </a>
            </template>

            <template x-if="m.media && m.media.kind === 'audio' && m.media.src">
                <audio controls preload="metadata" :src="m.media.src"
                    class="w-full mb-1" style="max-width: 320px;"></audio>
            </template>

            <template x-if="m.media && m.media.kind === 'video' && m.media.src">
                <video controls preload="metadata" :src="m.media.src"
                    class="rounded-lg max-h-72 w-full mb-1" style="max-width: 320px;"></video>
            </template>

            <template x-if="m.media && m.media.kind === 'document'">
                <a :href="m.media.src || '#'" :download="m.media.filename"
                    class="flex items-center gap-2 bg-stone-50 border border-stone-200 rounded-lg px-2 py-1.5 mb-1 hover:bg-stone-100 transition-colors"
                    :class="m.media.src ? '' : 'pointer-events-none opacity-70'">
                    <svg class="w-5 h-5 text-stone-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 12h6m-6 4h6m-6-8h6m2 12H7a2 2 0 01-2-2V7a2 2 0 012-2h6l5 5v9a2 2 0 01-2 2z" />
                    </svg>
                    <span class="text-xs truncate" x-text="m.media.filename || 'documento'"></span>
                </a>
            </template>

            {# ============ FALLBACK: mídia sem src (sem base64 disponível) ============ #}
            <template x-if="m.media && !m.media.src && m.media.kind !== 'document'">
                <div class="text-[11px] italic text-stone-500 mb-1">
                    <span x-text="tipoMidiaLabel(m.tipo)"></span>
                    <span class="text-stone-400">— pré-visualização indisponível</span>
                </div>
            </template>

            {# ============ TEXTO / CAPTION ============ #}
            <template x-if="(m.remetente === 'contato' ? m.conteudo : (m.resposta_bot || m.conteudo))">
                <div x-text="m.remetente === 'contato' ? m.conteudo : (m.resposta_bot || m.conteudo)"></div>
            </template>
        </div>
        <div class="text-[10px] text-stone-400 mt-1 px-1"
            :class="m.remetente === 'contato' ? 'text-left' : 'text-right'">
            <span x-text="m.timestamp ? new Date(m.timestamp).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}) : ''"></span>
            <template x-if="m.remetente !== 'contato'">
                <span class="ml-1" :class="m.respondida ? 'text-blue-500' : 'text-stone-400'"
                    x-text="m.respondida ? '✓✓' : '✓'"></span>
            </template>
        </div>
    </div>
</div>
