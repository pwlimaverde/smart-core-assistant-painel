{# Partial usado dentro de <template x-for="card in (board.cards[etapa.id] || [])">. Recebe `card`. #}
<div @click="onCardClick(card.atendimento_id, $event)"
    :data-atend-id="card.atendimento_id"
    role="button"
    tabindex="0"
    @keydown.enter.prevent="onCardClick(card.atendimento_id)"
    class="kanban-card group relative bg-white rounded-lg shadow-sm border border-stone-200 p-3 hover:shadow-md hover:border-[#a98f71]/40 transition-all cursor-grab active:cursor-grabbing select-none">

    {# Botão "ver detalhes completos" - kanban-no-drag para SortableJS não capturar #}
    <button @click.stop="onCardDetail(card.atendimento_id, $event)"
        class="kanban-no-drag absolute top-1.5 right-1.5 opacity-0 group-hover:opacity-100 p-1 rounded text-stone-400 hover:bg-stone-100 hover:text-stone-700 transition-all cursor-pointer"
        title="Ver detalhes completos">
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
    </button>

    <div class="flex items-start justify-between gap-2 mb-1.5 pr-5">
        <div class="text-xs font-semibold text-stone-800 line-clamp-2 flex-1" x-text="card.titulo"></div>
        <span class="text-sm shrink-0" x-text="card.canal_emoji"></span>
    </div>
    <div class="flex items-center gap-1 mb-2">
        <span class="text-[10px] px-1.5 py-0.5 rounded font-medium"
            :class="card.prioridade_label_class" x-text="card.prioridade"></span>
        <span class="text-[10px] text-stone-500" x-text="card.status_emoji + ' ' + card.status"></span>
    </div>
    <template x-if="card.preview_msg">
        <div class="text-[11px] text-stone-500 line-clamp-2 mb-1.5 italic"
            x-text="(card.preview_remetente === 'contato' ? '' : '↳ ') + card.preview_msg"></div>
    </template>
    <div class="flex items-center justify-between mt-2 pt-1.5 border-t border-stone-100">
        <template x-if="card.atendente">
            <div class="flex items-center gap-1 min-w-0">
                <div class="h-5 w-5 rounded-full bg-[#a98f71] text-white flex items-center justify-center text-[9px] font-bold shrink-0"
                    x-text="card.atendente.nome.slice(0,2).toUpperCase()"></div>
                <span class="text-[10px] text-stone-600 truncate" x-text="card.atendente.nome"></span>
            </div>
        </template>
        <template x-if="!card.atendente">
            <div class="text-[10px] text-stone-400 italic">Sem atendente</div>
        </template>
        <div class="flex items-center gap-1 shrink-0">
            <template x-if="card.sla_estourado">
                <span class="text-[10px] bg-red-100 text-red-700 font-semibold px-1.5 py-0.5 rounded" title="SLA estourado (>8h na etapa)">⚠️ SLA</span>
            </template>
            <span class="text-[10px] text-stone-400" x-text="card.tempo_ultima_msg"></span>
        </div>
    </div>
</div>
