{# Partial usado dentro de <template x-for="etapa in board.etapas">. Recebe `etapa`. #}
<div class="ws-col" :data-etapa-tipo="etapa.tipo_etapa">
    <header class="ws-col__head">
        <span class="ws-col__dot" :style="'background: ' + (etapa.dot_color || etapa.cor || '#a8a29e')"></span>
        <span class="ws-col__title" x-text="etapa.nome"></span>
        <span class="ws-col__count" x-text="etapa.count"></span>
        <button type="button" class="ws-col__menu ws-disabled"
            title="Opções da coluna (em breve)" aria-label="Opções da coluna"
            aria-disabled="true" disabled>
            <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <circle cx="5" cy="12" r="1.4"/>
                <circle cx="12" cy="12" r="1.4"/>
                <circle cx="19" cy="12" r="1.4"/>
            </svg>
        </button>
    </header>
    <div class="ws-col__body kanban-col-body" :data-etapa-id="etapa.id">
        <template x-for="card in (board.cards[etapa.id] || [])" :key="card.atendimento_id">
            {% include "atendimento_unificado/partials/kanban_card.html" %}
        </template>
        <div x-show="(board.cards[etapa.id] || []).length === 0" class="ws-col__empty">
            Solte cards aqui
        </div>
    </div>
</div>
