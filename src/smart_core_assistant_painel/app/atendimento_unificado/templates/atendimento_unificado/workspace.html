{% extends "base_dashboard.html" %}
{% load static %}

{% block content %}
<div id="workspace-root"
    x-data="workspaceStore({
        fluxoId: {{ fluxo_id|default:'null' }},
        tenantSlug: '{{ tenant_slug|escapejs }}',
        atendenteId: {{ atendente_id|default:'null' }},
        atendenteNome: '{{ atendente_nome|escapejs }}',
        endpoints: {
            fluxos: '{% url 'atendimento_unificado:atendimento_unificado_api:fluxos_list' %}',
            conversations: '{% url 'atendimento_unificado:atendimento_unificado_api:conversations_list' %}',
            conversationsBase: '{% url 'atendimento_unificado:atendimento_unificado_api:conversations_list' %}',
            board: '{% url 'atendimento_unificado:atendimento_unificado_api:board_snapshot' %}',
            boardMove: '{% url 'atendimento_unificado:atendimento_unificado_api:board_move' %}',
            boardAssign: '{% url 'atendimento_unificado:atendimento_unificado_api:board_assign' %}',
            sse: '{% url 'atendimento_unificado:workspace_events' %}',
            customFieldsBase: '{% url 'atendimento_unificado:atendimento_unificado_api:conversations_list' %}',
            export: '{% url 'atendimento_unificado:atendimento_unificado_api:export' %}'
        }
    })"
    x-init="init()"
    class="flex flex-col h-[calc(100vh-7rem)] -m-6">

    <!-- Topbar do Workspace -->
    <div class="bg-white border-b border-stone-200 px-6 py-3 flex items-center gap-4">
        <h1 class="text-lg font-bold text-stone-800 flex items-center">
            <span class="p-1.5 bg-[#a98f71]/10 rounded-lg mr-2 text-[#a98f71]">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
                </svg>
            </span>
            Workspace
        </h1>

        <div class="flex items-center gap-2 ml-4">
            <label class="text-xs text-stone-500 uppercase tracking-wider">Fluxo</label>
            <select x-model.number="fluxoId" @change="onFluxoChange()"
                class="text-sm border border-stone-300 rounded-lg px-3 py-1.5 focus:ring-2 focus:ring-[#a98f71]/30 focus:outline-none bg-white">
                <template x-for="f in fluxos" :key="f.id">
                    <option :value="f.id" x-text="f.nome + ' — ' + f.departamento_nome"></option>
                </template>
                <option x-show="fluxos.length === 0" disabled selected>Sem fluxos disponíveis</option>
            </select>
        </div>

        <div class="ml-auto flex items-center gap-2">
            <a :href="endpoints.export + '?fluxo=' + (fluxoId || '') + '&formato=csv'"
                class="px-3 py-1 text-xs font-medium border border-stone-300 rounded-lg hover:bg-stone-50 text-stone-600 transition-colors"
                title="Exportar conversas ativas em CSV">
                ↓ CSV
            </a>
            <div class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium"
                :class="sseConnected ? 'bg-green-100 text-green-800' : 'bg-stone-100 text-stone-600'">
                <span class="w-1.5 h-1.5 rounded-full mr-1.5"
                    :class="sseConnected ? 'bg-green-500 animate-pulse' : 'bg-stone-400'"></span>
                <span x-text="sseConnected ? 'Tempo real' : 'Desconectado'"></span>
            </div>
            <div class="bg-stone-100 rounded-lg p-0.5 inline-flex">
                <button @click="mode = 'conversas'"
                    class="px-3 py-1 text-xs font-semibold rounded-md transition-colors"
                    :class="mode === 'conversas' ? 'bg-white text-stone-800 shadow-sm' : 'text-stone-500 hover:text-stone-700'">
                    Conversas
                </button>
                <button @click="mode = 'kanban'"
                    class="px-3 py-1 text-xs font-semibold rounded-md transition-colors"
                    :class="mode === 'kanban' ? 'bg-white text-stone-800 shadow-sm' : 'text-stone-500 hover:text-stone-700'">
                    Kanban
                </button>
            </div>
        </div>
    </div>

    <!-- Modo Conversas -->
    <div x-show="mode === 'conversas'" class="flex-1 flex overflow-hidden">
        <!-- Sidebar de conversas -->
        <aside class="w-80 bg-white border-r border-stone-200 flex flex-col overflow-hidden">
            <div class="p-3 border-b border-stone-200 space-y-2">
                <input type="text" x-model.debounce.300ms="search"
                    @input="loadConversations()"
                    placeholder="Buscar contato, telefone ou assunto…"
                    class="w-full text-sm border border-stone-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-[#a98f71]/30 focus:outline-none">
                <input type="text" x-model.debounce.300ms="filterTag"
                    @input="loadConversations()"
                    placeholder="Filtrar por tag…"
                    class="w-full text-xs border border-stone-200 rounded-lg px-3 py-1.5 focus:ring-2 focus:ring-[#a98f71]/30 focus:outline-none">
            </div>
            <div class="flex-1 overflow-y-auto divide-y divide-stone-100">
                <template x-for="c in conversations" :key="c.atendimento_id">
                    {% include "atendimento_unificado/partials/conversation_item.html" %}
                </template>
                <div x-show="conversations.length === 0" class="p-6 text-center text-stone-400 text-sm">
                    Nenhuma conversa.
                </div>
            </div>
        </aside>

        <!-- Chat -->
        <section class="flex-1 flex flex-col bg-stone-50">
            <template x-if="activeConv">
                <div class="flex flex-col h-full">
                    <header class="bg-white border-b border-stone-200 px-4 py-3 flex items-center gap-3">
                        <div class="h-9 w-9 rounded-full bg-[#a98f71] flex items-center justify-center text-white font-bold text-xs"
                            x-text="(activeConv.contato_nome || '?').slice(0,2).toUpperCase()"></div>
                        <div class="flex-1 min-w-0">
                            <div class="text-sm font-semibold text-stone-800 truncate" x-text="activeConv.contato_nome"></div>
                            <div class="text-xs text-stone-500 truncate" x-text="activeConv.telefone"></div>
                        </div>
                        <div class="text-xs text-stone-400" x-text="activeConv.etapa_nome || '—'"></div>
                    </header>
                    <div class="flex-1 overflow-y-auto p-4 space-y-2" x-ref="messagesContainer">
                        <template x-for="m in messages" :key="m.id">
                            {% include "atendimento_unificado/partials/chat_message.html" %}
                        </template>
                        <div x-show="messages.length === 0" class="text-center text-stone-400 text-sm py-8">
                            Nenhuma mensagem ainda.
                        </div>
                    </div>
                    <footer class="bg-white border-t border-stone-200 p-3">
                        <form @submit.prevent="sendMessage()" class="flex gap-2">
                            <label class="flex items-center justify-center px-2 cursor-pointer text-stone-400 hover:text-stone-600 transition-colors" title="Enviar mídia">
                                <input type="file" class="hidden" @change="uploadMedia($event, activeConv.atendimento_id)">
                                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/>
                                </svg>
                            </label>
                            <textarea x-model="composer"
                                @keydown.enter="if (!$event.shiftKey) { $event.preventDefault(); sendMessage(); }"
                                rows="1"
                                placeholder="Digite sua mensagem… (Shift+Enter quebra linha)"
                                class="flex-1 text-sm border border-stone-300 rounded-lg px-3 py-2 resize-none focus:ring-2 focus:ring-[#a98f71]/30 focus:outline-none"></textarea>
                            <button type="submit" :disabled="sending"
                                class="px-4 py-2 text-sm bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors flex items-center disabled:opacity-50">
                                <svg class="w-4 h-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M5 12h14M12 5l7 7-7 7"/>
                                </svg>
                                Enviar
                            </button>
                        </form>
                    </footer>
                </div>
            </template>
            <template x-if="!activeConv">
                <div class="flex-1 flex items-center justify-center text-stone-400 text-sm">
                    Selecione uma conversa para visualizar.
                </div>
            </template>
        </section>

        <!-- Painel direito (detalhes) -->
        <aside class="w-80 bg-stone-50 border-l border-stone-200 overflow-y-auto"
            x-show="activeConv">
            {% include "atendimento_unificado/partials/detail_panel.html" %}
        </aside>
    </div>

    <!-- Modo Kanban -->
    <div x-show="mode === 'kanban'" class="flex-1 overflow-x-auto overflow-y-hidden bg-stone-50 p-4">
        <div class="flex gap-3 h-full">
            <template x-for="etapa in board.etapas" :key="etapa.id">
                {% include "atendimento_unificado/partials/kanban_column.html" %}
            </template>
            <div x-show="board.etapas.length === 0" class="m-auto text-stone-400 text-sm">
                Selecione um fluxo para exibir o kanban.
            </div>
        </div>
    </div>

    <!-- Chat Drawer (sobre o kanban) -->
    {% include "atendimento_unificado/partials/chat_drawer.html" %}
</div>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
<script src="{% static 'atendimento_unificado/js/workspace_alpine.js' %}" defer></script>
{% endblock %}
