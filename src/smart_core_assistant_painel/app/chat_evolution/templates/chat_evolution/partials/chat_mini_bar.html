{% comment %}Mini-bar flutuante mostrada quando o chat está minimizado (focusMode === 'board')
e há atendimento ativo. Mantém o contexto sem ocupar a tela.{% endcomment %}
<div class="ws-mini" role="dialog" aria-label="Atendimento ativo minimizado"
    x-show="focusMode === 'board' && activeConv"
    x-transition.opacity
    style="display: none;">

    <header class="ws-mini__head" @click="openChat(activeConv.atendimento_id)">
        <div class="ws-mini__av"
            :class="(activeConv && activeConv.contato_avatar_url) ? 'ws-mini__av ws-mini__av--img' : 'ws-mini__av'">
            <template x-if="activeConv && activeConv.contato_avatar_url">
                <img :src="activeConv.contato_avatar_url"
                    :alt="(activeConv && activeConv.contato_nome) || ''"
                    loading="lazy"
                    @error="activeConv.contato_avatar_url = ''">
            </template>
            <template x-if="!(activeConv && activeConv.contato_avatar_url)">
                <span x-text="(activeConv && activeConv.contato_nome || '?').slice(0,2).toUpperCase()"></span>
            </template>
        </div>
        <div class="ws-mini__info">
            <div class="ws-mini__name" x-text="activeConv && activeConv.contato_nome || 'Atendimento'"></div>
            <div class="ws-mini__sub" x-text="activeConv && (activeConv.telefone || activeConv.etapa_nome || '')"></div>
        </div>
        <button type="button" class="ws-mini__btn" title="Expandir chat"
            @click.stop="setFocus('split')">
            <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
            </svg>
        </button>
        <button type="button" class="ws-mini__btn" title="Fechar atendimento"
            @click.stop="activeConv = null; messages = []; activeDetail = null">
            <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
        </button>
    </header>

    <template x-if="messages.length > 0">
        <div class="ws-mini__preview">
            <div class="ws-mini__preview__ico">
                <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.4-4 8-9 8a9.9 9.9 0 01-4.3-1L3 20l1.4-3.7C3.5 15 3 13.6 3 12c0-4.4 4-8 9-8s9 3.6 9 8z"/>
                </svg>
            </div>
            <div style="flex: 1; min-width: 0;">
                <div class="ws-mini__preview__t"
                    x-text="(messages[messages.length-1] && (messages[messages.length-1].conteudo || messages[messages.length-1].resposta_bot)) || 'Sem mensagens ainda'"></div>
                <div class="ws-mini__preview__when"
                    x-text="messages[messages.length-1] && messages[messages.length-1].timestamp
                            ? new Date(messages[messages.length-1].timestamp).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})
                            : ''"></div>
            </div>
        </div>
    </template>

    <div class="ws-mini__quick">
        <button type="button" class="primary" @click="setFocus('split')">
            <svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.4-4 8-9 8a9.9 9.9 0 01-4.3-1L3 20l1.4-3.7C3.5 15 3 13.6 3 12c0-4.4 4-8 9-8s9 3.6 9 8z"/>
            </svg>
            Abrir conversa
        </button>
        <button type="button" @click="detailDrawerOpen = true; setFocus('split')" title="Ver detalhes">
            <svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6">
                <circle cx="12" cy="12" r="9"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v.01M11 12h1v5h1"/>
            </svg>
        </button>
    </div>
</div>
