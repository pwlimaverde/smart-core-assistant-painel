{# Painel Lateral de Informações do Contato / Detalhes (Chat Sidebar) #}
<template x-if="infoPanelOpen && activeConv">
    <aside class="w-80 border-l border-stone-200 bg-white flex flex-col h-full shrink-0">
        
        {# Header do Painel #}
        <header class="p-4 border-b border-stone-200 flex items-center justify-between">
            <h3 class="text-sm font-semibold text-stone-800">Detalhes do Contato</h3>
            <button @click="infoPanelOpen = false" class="text-stone-400 hover:text-stone-600">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </header>

        {# Conteúdo #}
        <div class="flex-1 overflow-y-auto p-4 space-y-6 scrollbar-thin">
            
            {# Perfil do Contato #}
            <div class="flex flex-col items-center text-center space-y-2">
                <div class="h-20 w-20 rounded-full bg-[#a98f71] flex items-center justify-center text-white font-bold text-2xl"
                    x-text="(activeConv.contato_nome || '?').slice(0,2).toUpperCase()"></div>
                <div>
                    <h4 class="text-base font-semibold text-stone-800" x-text="activeConv.contato_nome"></h4>
                    <p class="text-xs text-stone-500" x-text="activeConv.telefone"></p>
                </div>
            </div>

            {# Dados Gerais #}
            <div class="space-y-3">
                <h5 class="text-xs font-semibold text-stone-400 uppercase tracking-wider">Informações</h5>
                <div class="bg-stone-50 rounded-lg p-3 space-y-2 text-xs">
                    <div class="flex justify-between">
                        <span class="text-stone-500">Prioridade</span>
                        <span class="font-medium text-stone-800" x-text="activeConv.prioridade || 'Não definida'"></span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-stone-500">Etapa Kanban</span>
                        <span class="font-medium text-stone-800" x-text="activeConv.etapa_nome || '—'"></span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-stone-500">Atendente</span>
                        <span class="font-medium text-stone-800" x-text="activeConv.atendente_nome || 'Não atribuído'"></span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-stone-500">Assunto</span>
                        <span class="font-medium text-stone-800" x-text="activeConv.assunto || '—'"></span>
                    </div>
                </div>
            </div>

            {# Mídia & Arquivos da Conversa #}
            <div class="space-y-3">
                <div class="flex items-center justify-between">
                    <h5 class="text-xs font-semibold text-stone-400 uppercase tracking-wider">Mídia & Arquivos</h5>
                    <span class="text-[10px] text-stone-400" x-text="(medias || []).length + ' itens'"></span>
                </div>
                
                <div class="grid grid-cols-3 gap-2">
                    <template x-for="m in medias" :key="m.mensagem_id">
                        <button type="button" @click="openLightbox(m)" 
                                class="aspect-square bg-stone-100 rounded overflow-hidden flex items-center justify-center border border-stone-200 hover:opacity-80 transition-opacity">
                            <template x-if="m.kind === 'image' && m.src">
                                <img :src="m.src" class="object-cover w-full h-full" />
                            </template>
                            <template x-if="m.kind === 'video' && m.src">
                                <div class="relative w-full h-full flex items-center justify-center bg-black">
                                    <video :src="m.src" class="w-full h-full object-cover opacity-60"></video>
                                    <svg class="absolute w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24">
                                        <path d="M8 5v14l11-7z" />
                                    </svg>
                                </div>
                            </template>
                            <template x-if="m.kind === 'audio'">
                                <div class="text-stone-500">
                                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                                    </svg>
                                </div>
                            </template>
                            <template x-if="m.kind === 'document'">
                                <div class="text-stone-500 flex flex-col items-center">
                                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                                    </svg>
                                    <span class="text-[8px] truncate w-full px-1 text-center" x-text="m.filename.split('.').pop().toUpperCase()"></span>
                                </div>
                            </template>
                        </button>
                    </template>
                </div>
                
                <template x-if="(medias || []).length === 0">
                    <p class="text-xs text-stone-400 italic text-center py-4 bg-stone-50 rounded-lg">Nenhuma mídia nesta conversa.</p>
                </template>
            </div>

        </div>
    </aside>
</template>
