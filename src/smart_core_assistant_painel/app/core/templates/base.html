<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Smart Core Assistant{% endblock %}</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>

    <style>
        [x-cloak] { display: none !important; }
    </style>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/app.css' %}?v=4">

    <style type="text/tailwindcss">
        @theme {
          --color-gold-primary: #a98f71;
          --color-gold-dark: #8b7355;
          --font-family-sans: 'Outfit', sans-serif;
        }
        
        .font-outfit {
            font-family: 'Outfit', sans-serif;
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>

<body class="bg-stone-50 text-stone-900 font-outfit antialiased selection:bg-[#a98f71] selection:text-white">

    {% block layout %}
    {% block navbar %}{% endblock %}

    {% block content %}{% endblock %}

    {% block footer %}{% endblock %}
    {% endblock %}

    {% block extra_scripts %}{% endblock %}
</body>

</html>
