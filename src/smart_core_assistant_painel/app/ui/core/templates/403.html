{% extends "base.html" %}
{% load static %}

{% block 'conteudo' %}
<div class="min-h-screen bg-stone-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
        <h1 class="text-9xl font-bold text-[#a98f71]">403</h1>
        <h2 class="mt-4 text-3xl font-bold tracking-tight text-gray-900">Acesso Negado</h2>
        <p class="mt-4 text-base text-gray-500">Você não tem permissão para acessar esta página.</p>
        <div class="mt-10 flex items-center justify-center gap-x-6">
            <a href="/" class="text-base font-medium text-indigo-600 hover:text-indigo-500">
                <span aria-hidden="true">&larr;</span> Voltar para a Home
            </a>
            {% if not user.is_authenticated %}
            <a href="{% url 'login' %}"
                class="rounded-md bg-indigo-600 px-3.5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
                Fazer Login
            </a>
            {% endif %}
        </div>
    </div>
</div>
{% endblock 'conteudo' %}
