{% extends "base_public.html" %}
{% load static %}

{% block content %}
<div class="flex min-h-screen items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-stone-900 relative">
    <!-- Background Texture -->
    <div class="absolute inset-0 z-0 opacity-20 bg-[url('https://grainy-gradients.vercel.app/noise.svg')]"></div>
    <div class="absolute inset-0 z-0 bg-gradient-to-b from-stone-900 via-stone-800 to-stone-900 opacity-80"></div>

    <div
        class="w-full max-w-md space-y-8 relative z-10 bg-white/5 backdrop-blur-xl p-8 rounded-2xl border border-white/10 shadow-2xl">
        <div class="text-center">
            <img class="mx-auto h-12 w-auto" src="{% static 'img/logo_branca_smart_v2.png' %}" alt="Smart Core">
            <h2 class="mt-6 text-3xl font-bold tracking-tight text-white">Criar nova conta</h2>
            <p class="mt-2 text-sm text-stone-400">
                Já possui acesso? <a href="{% url 'login' %}"
                    class="font-medium text-[#a98f71] hover:text-[#8b7355] transition-colors">Faça login agora</a>
            </p>
        </div>

        {% if messages %}
        <div class="space-y-2">
            {% for message in messages %}
            <div
                class="p-4 rounded-lg text-sm font-medium
                {% if message.tags == 'error' %}bg-red-500/10 text-red-500 border border-red-500/20{% else %}bg-green-500/10 text-green-500 border border-green-500/20{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form class="mt-8 space-y-6" action="{% url 'cadastro' %}" method="POST">
            {% csrf_token %}

            <div class="space-y-4">
                <div>
                    <label for="username" class="block text-sm font-medium leading-6 text-white">Usuário</label>
                    <div class="mt-2">
                        <input id="username" name="username" type="text" required
                            class="block w-full rounded-md border-0 bg-stone-800/50 py-2.5 px-4 text-white ring-1 ring-inset ring-white/10 placeholder:text-stone-500 focus:ring-2 focus:ring-inset focus:ring-[#a98f71] sm:text-sm sm:leading-6 transition-all">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium leading-6 text-white">Senha</label>
                    <div class="mt-2">
                        <input id="password" name="senha" type="password" required
                            class="block w-full rounded-md border-0 bg-stone-800/50 py-2.5 px-4 text-white ring-1 ring-inset ring-white/10 placeholder:text-stone-500 focus:ring-2 focus:ring-inset focus:ring-[#a98f71] sm:text-sm sm:leading-6 transition-all">
                    </div>
                </div>

                <div>
                    <label for="confirm_password" class="block text-sm font-medium leading-6 text-white">Confirmar
                        Senha</label>
                    <div class="mt-2">
                        <input id="confirm_password" name="confirmar_senha" type="password" required
                            class="block w-full rounded-md border-0 bg-stone-800/50 py-2.5 px-4 text-white ring-1 ring-inset ring-white/10 placeholder:text-stone-500 focus:ring-2 focus:ring-inset focus:ring-[#a98f71] sm:text-sm sm:leading-6 transition-all">
                    </div>
                </div>
            </div>

            <div>
                <button type="submit"
                    class="group relative flex w-full justify-center rounded-lg bg-[#a98f71] py-3 px-4 text-sm font-semibold text-white hover:bg-[#8b7355] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#a98f71] shadow-lg shadow-[#a98f71]/20 transition-all">
                    Cadastrar
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
