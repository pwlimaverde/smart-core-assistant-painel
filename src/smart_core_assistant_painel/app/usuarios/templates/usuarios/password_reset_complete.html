{% extends "base_public.html" %}
{% load static %}

{% block public_navbar %}
<nav class="absolute top-0 left-0 w-full z-50 py-6">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-center">
        <a href="/" class="flex items-center gap-2 group transition-opacity hover:opacity-80">
            <img src="{% static 'img/logo_branca_smart_v2.png' %}" alt="Smart Core" class="h-10 w-auto">
            <span class="text-xl font-medium tracking-wide text-white">Smart Core</span>
        </a>
    </div>
</nav>
{% endblock %}

{% block content %}
<div class="flex min-h-screen flex-col items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-[#0c0a09] relative overflow-hidden">
    <div class="absolute inset-0 z-0">
        <div class="absolute inset-0 opacity-[0.03] bg-[url('https://grainy-gradients.vercel.app/noise.svg')]"></div>
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[1000px] h-[600px] bg-[#a98f71]/10 rounded-full blur-[120px] mix-blend-screen"></div>
    </div>

    <div class="w-full max-w-md relative z-10 animate-fade-in-up">
        <div class="bg-[#1c1917]/80 backdrop-blur-xl p-8 sm:p-10 rounded-3xl border border-white/5 shadow-2xl shadow-black/50 ring-1 ring-white/5 text-center">
            
            <div class="mb-6 flex justify-center">
                <div class="w-16 h-16 bg-emerald-500/10 rounded-full flex items-center justify-center mb-4">
                    <svg class="w-8 h-8 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                </div>
            </div>

            <h2 class="text-2xl font-bold tracking-tight text-white mb-4">Senha Redefinida!</h2>
            <p class="text-stone-400 text-sm mb-8 leading-relaxed">
                Sua senha foi alterada com sucesso. Você já pode acessar sua conta utilizando a nova credencial.
            </p>

            <a href="{% url 'login' %}" class="group relative flex w-full justify-center rounded-xl bg-[#a98f71] py-3.5 px-4 text-sm font-semibold text-white hover:bg-[#8b7355] transition-all shadow-lg hover:-translate-y-0.5">
                Fazer Login
            </a>
        </div>
    </div>
</div>

<style>
    @keyframes fadeInUp { from { opacity: 0; transform: translate3d(0, 20px, 0); } to { opacity: 1; transform: translate3d(0, 0, 0); } }
    .animate-fade-in-up { animation: fadeInUp 0.6s ease-out forwards; }
</style>
{% endblock %}
