{# Segmented control de foco — usado no topbar.
   Lê/escreve focusMode no workspaceStore. Atalhos: Alt+1/2/3. #}
<div class="ws-focus-seg" role="tablist" title="Modo de foco (Alt+1/2/3)">
    <button type="button"
        @click="setFocus('board')"
        :class="focusMode === 'board' ? 'active' : ''"
        title="Kanban (Alt+1)">
        <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6">
            <rect x="3" y="4" width="5" height="16" rx="1.5"/>
            <rect x="10" y="4" width="5" height="10" rx="1.5"/>
            <rect x="17" y="4" width="4" height="13" rx="1.5"/>
        </svg>
        Kanban
    </button>
    <button type="button"
        @click="setFocus('split')"
        :class="focusMode === 'split' ? 'active' : ''"
        title="Dividido (Alt+2)">
        <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6">
            <rect x="3" y="3" width="6" height="6" rx="1.5"/>
            <rect x="15" y="15" width="6" height="6" rx="1.5"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 6h6a3 3 0 013 3v6"/>
        </svg>
        Dividido
    </button>
    <button type="button"
        @click="setFocus('chat')"
        :class="focusMode === 'chat' ? 'active' : ''"
        title="Atendimento (Alt+3)">
        <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.4-4 8-9 8a9.9 9.9 0 01-4.3-1L3 20l1.4-3.7C3.5 15 3 13.6 3 12c0-4.4 4-8 9-8s9 3.6 9 8z"/>
        </svg>
        Atendimento
    </button>
</div>
