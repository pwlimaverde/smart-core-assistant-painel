{# Partial usado dentro de <template x-for="m in enrichedMessages">. Recebe m
   enriquecido com _showDateSep, _dateLabel, _stacked, _isFirstUnread.
   Bolhas WhatsApp-style com mídia inline + toggle de análise IA + lightbox.

   IMPORTANTE: o <template x-for> do Alpine exige um ÚNICO elemento raiz. Por isso
   todo o conteúdo é envolvido por um wrapper único. Usamos display:contents para
   que separadores e balão continuem sendo filhos diretos do flex container pai. #}

<div class="ws-msg-row" style="display:contents">

{# ============ SEPARADOR DE DATA ============ #}
<template x-if="m._showDateSep">
    <div class="ws-chat__day-sep" aria-hidden="true">
        <span class="ws-chat__day-sep__label" x-text="m._dateLabel"></span>
    </div>
</template>

{# ============ DIVISOR "NOVAS MENSAGENS" ============ #}
<template x-if="m._isFirstUnread">
    <div class="ws-chat__new-sep" aria-label="Novas mensagens">
        <span>novas mensagens</span>
    </div>
</template>

<div x-data="{ showAnalise: false }"
    :class="(m.remetente === 'contato' ? 'ws-bub ws-bub--in' : 'ws-bub ws-bub--out') + (m._stacked ? ' ws-bub--stacked' : '')"
    @dblclick="setReplyTo(m)">

    {# ============ BLOCO CITADO (REPLY) ============ #}
    <template x-if="m.quoted">
        <div class="ws-bub__quoted"
            :class="m.remetente === 'contato' ? 'ws-bub__quoted--in' : 'ws-bub__quoted--out'">
            <div class="ws-bub__quoted-bar"></div>
            <div class="ws-bub__quoted-body">
                <span class="ws-bub__quoted-who"
                    x-text="m.quoted.remetente === 'contato' ? 'Contato' : 'Atendente'"></span>
                <span class="ws-bub__quoted-txt"
                    x-text="m.quoted.conteudo_preview || '[mídia]'"></span>
            </div>
        </div>
    </template>

    {# ============ IMAGEM ============ #}
    <template x-if="m.media && m.media.kind === 'image' && m.media.src">
        <button type="button" class="ws-bub__media-btn ws-img"
            @click="openLightbox(m.media)"
            :title="m.media.filename || 'Visualizar imagem'">
            <img :src="m.media.src" :alt="m.media.filename || 'imagem'"
                loading="lazy" />
        </button>
    </template>

    {# ============ ÁUDIO ============ #}
    <template x-if="m.media && m.media.kind === 'audio' && m.media.src">
        <div class="ws-aud"
            :class="(m.media.ptt ? 'ws-aud--voice ' : '') + (m.remetente === 'contato' ? '' : 'ws-aud--out')">
            <svg class="ws-aud__ico" width="18" height="18" fill="none"
                viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 18.75a6 6 0 0 0 6-6v-1.5m-6 7.5a6 6 0 0 1-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 0 1-3-3V4.5a3 3 0 1 1 6 0v8.25a3 3 0 0 1-3 3Z"/>
            </svg>
            <audio controls preload="metadata" :src="m.media.src"
                class="ws-aud__player"></audio>
            <span class="ws-aud__dur"
                x-text="formatDuration(m.media.seconds)"
                x-show="m.media.seconds"></span>
        </div>
    </template>

    {# ============ VÍDEO ============ #}
    <template x-if="m.media && m.media.kind === 'video' && m.media.src">
        <button type="button" class="ws-bub__media-btn ws-vid"
            @click="openLightbox(m.media)">
            <video :src="m.media.src" preload="metadata"
                class="ws-vid__thumb"></video>
            <span class="ws-vid__play" aria-hidden="true">
                <svg width="42" height="42" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z"/>
                </svg>
            </span>
            <span class="ws-vid__dur"
                x-text="formatDuration(m.media.seconds)"
                x-show="m.media.seconds"></span>
        </button>
    </template>

    {# ============ DOCUMENTO ============ #}
    <template x-if="m.media && m.media.kind === 'document'">
        <div class="ws-doc" :class="m.media.is_pdf ? 'ws-doc--pdf' : ''">
            <div class="ws-doc__ico"
                x-text="(m.media.filename || 'DOC').split('.').pop().toUpperCase().slice(0, 4)"></div>
            <div class="ws-doc__info">
                <div class="ws-doc__name" x-text="m.media.filename || 'documento'"></div>
                <div class="ws-doc__size" x-text="m.media.size_label || ''"></div>
            </div>
            <div class="ws-doc__actions">
                {# PDF: visualizar abre lightbox com iframe #}
                <template x-if="m.media.is_pdf && m.media.src">
                    <button type="button" class="ws-doc__btn"
                        @click="openLightbox(m.media)" title="Visualizar PDF">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.8">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.964-7.178z"/>
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                    </button>
                </template>
                {# Download direto #}
                <template x-if="m.media.src">
                    <a :href="m.media.src" :download="m.media.filename || 'arquivo'"
                        class="ws-doc__btn" title="Baixar">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.8">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M12 4v12m0 0l-4-4m4 4l4-4M5 20h14"/>
                        </svg>
                    </a>
                </template>
            </div>
        </div>
    </template>

    {# ============ FALLBACK: mídia sem src (sem base64 disponível) ============ #}
    <template x-if="m.media && !m.media.src">
        <div class="ws-bub__media-fallback">
            <span x-text="tipoMidiaLabel(m.tipo)"></span>
            <span class="ws-bub__media-fallback-hint">— pré-visualização indisponível</span>
        </div>
    </template>

    {# ============ BOTÃO DOWNLOAD (imagem/áudio/vídeo) ============ #}
    {# Documento já possui ação de download própria no bloco acima. #}
    <template x-if="m.media && m.media.src && m.media.kind !== 'document'">
        <button type="button" class="ws-bub__download"
            @click="downloadMedia(m.media)" title="Baixar arquivo">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 4v12m0 0l-4-4m4 4l4-4M5 20h14"/>
            </svg>
            <span>Baixar</span>
        </button>
    </template>

    {# TOGGLE ANÁLISE IA — áudio: transcrição + resumo; mídia visual: só resumo. #}
    <template x-if="m.resumo_midia || m.analise_midia">
        <div class="ws-bub__analise">
            <button type="button" class="ws-bub__analise-toggle"
                @click="showAnalise = !showAnalise"
                :title="showAnalise ? 'Ocultar análise IA' : 'Ver análise IA'">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="9"/>
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 8v.01M11 12h1v4h1"/>
                </svg>
                <span x-text="showAnalise ? 'Ocultar análise' : 'Ver análise IA'"></span>
            </button>
            <div class="ws-bub__analise-body" x-show="showAnalise" x-cloak
                x-transition.opacity>
                {# Transcrição completa (áudio) #}
                <template x-if="m.analise_midia">
                    <div class="ws-bub__analise-sec">
                        <span class="ws-bub__analise-label">Transcrição</span>
                        <div class="ws-bub__analise-txt" style="white-space:pre-wrap"
                            x-text="m.analise_midia"></div>
                    </div>
                </template>
                {# Resumo geral gerado pela IA #}
                <template x-if="m.resumo_midia">
                    <div class="ws-bub__analise-sec">
                        <span class="ws-bub__analise-label">Resumo</span>
                        <div class="ws-bub__analise-txt" style="white-space:pre-wrap"
                            x-text="m.resumo_midia"></div>
                    </div>
                </template>
            </div>
        </div>
    </template>

    {# TEXTO / CAPTION — white-space:pre-wrap preserva as quebras de linha (\n). #}
    <template x-if="bubbleText(m)">
        <div class="ws-bub__txt" style="white-space:pre-wrap" x-text="bubbleText(m)"></div>
    </template>

    {# ============ RODAPÉ (timestamp + status) ============ #}
    <div class="ws-bub__foot">
        <span x-text="m.timestamp ? new Date(m.timestamp).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}) : ''"></span>
        <template x-if="m.remetente !== 'contato'">
            <span class="ws-bub__check"
                :class="{
                    'ws-bub__check--pending':   m.status_envio === 'pending',
                    'ws-bub__check--sent':      m.status_envio === 'sent',
                    'ws-bub__check--delivered': m.status_envio === 'delivered',
                    'ws-bub__check--read':      m.status_envio === 'read' || m.respondida,
                    'ws-bub__check--failed':    m.status_envio === 'failed',
                }"
                x-text="statusEnvioIcon(m.status_envio, m.respondida)"></span>
        </template>
    </div>
</div>

</div>{# /.ws-msg-row — wrapper de root único do x-for #}
