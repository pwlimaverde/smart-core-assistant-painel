{# Componente do Composer de Mensagens com Anexo, Citação e Gravação de Áudio integrado ao Design System (ws-composer) #}
<footer class="ws-composer">
    {# Banner de reply — aparece quando o usuário deu duplo-clique em um balão #}
    <div class="ws-composer__reply" x-show="replyTo" x-cloak x-transition.opacity>
        <div class="ws-composer__reply-bar"></div>
        <div class="ws-composer__reply-body">
            <span class="ws-composer__reply-who"
                x-text="replyTo && replyTo.remetente === 'contato' ? 'Contato' : 'Atendente'"></span>
            <span class="ws-composer__reply-txt"
                x-text="replyTo ? (replyTo.conteudo || replyTo.resposta_bot || '[mídia]') : ''"></span>
        </div>
        <button type="button" class="ws-composer__reply-close"
            @click="clearReplyTo()" title="Cancelar resposta"
            aria-label="Cancelar resposta">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M6 18L18 6M6 6l12 12"/>
            </svg>
        </button>
    </div>
    {# Modo gravação de voz #}
    <div class="ws-composer__recording" x-show="isRecording" x-cloak>
        <button type="button" class="ws-composer__rec-cancel"
            @click="cancelRecording()" title="Cancelar gravação">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
        </button>
        <span class="ws-composer__rec-dot" aria-hidden="true">●</span>
        <span class="ws-composer__rec-timer"
            x-text="Math.floor(recordingSeconds/60).toString().padStart(2,'0') + ':' + (recordingSeconds%60).toString().padStart(2,'0')"></span>
        <button type="button" class="ws-composer__rec-send"
            @click="stopRecording()" title="Enviar áudio">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
            </svg>
        </button>
    </div>
    <form @submit.prevent="sendMessage()" class="ws-composer__row" x-show="!isRecording">
        <label class="ws-composer__btn" title="Anexar mídia" style="cursor:pointer;">
            <input type="file" style="display:none;"
                accept="image/*,video/*,audio/*,application/pdf,.doc,.docx,.xls,.xlsx"
                @change="uploadMedia($event, activeConv.atendimento_id)">
            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.2 7l-6.6 6.6a2 2 0 102.8 2.8l6.4-6.6a4 4 0 00-5.7-5.7L5.8 10.8a6 6 0 108.5 8.5L20.5 13"/>
            </svg>
        </label>
        <textarea x-model="composer"
            class="ws-composer__input"
            rows="1"
            placeholder="Mensagem… (Shift+Enter quebra linha)"
            @input="onComposerInput()"
            @keydown.enter="if (!$event.shiftKey) { $event.preventDefault(); sendMessage(); }"></textarea>
        <template x-if="composer.trim()">
            <button type="submit" :disabled="sending"
                class="ws-composer__send" title="Enviar">
                <svg width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                </svg>
            </button>
        </template>
        <template x-if="!composer.trim()">
            <button type="button" class="ws-composer__send ws-composer__send--mic"
                title="Gravar áudio" @click="startRecording()">
                <svg width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6">
                    <rect x="9" y="3" width="6" height="11" rx="3"/>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 11a7 7 0 0014 0M12 18v3M9 21h6"/>
                </svg>
            </button>
        </template>
    </form>
</footer>
