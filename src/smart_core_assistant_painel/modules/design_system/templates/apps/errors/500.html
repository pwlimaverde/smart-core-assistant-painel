{% extends "base_public.html" %}



{% block public_navbar %}
<!-- Minimal Header -->
<nav class="absolute top-0 left-0 w-full z-50 py-6">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-center">
        <a href="/" class="flex items-center gap-2 group transition-opacity hover:opacity-80">
            <img src="{{ static('img/logo_branca_smart_v2.png') }}" alt="Smart Core" class="h-10 w-auto">
            <span class="text-xl font-medium tracking-wide text-white">
                Smart Core
            </span>
        </a>
    </div>
</nav>
{% endblock %}

{% block content %}
<div class="flex min-h-screen flex-col items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-[#0c0a09] relative overflow-hidden">
    <!-- Background Effects -->
    <div class="absolute inset-0 z-0">
        <!-- Noise Texture -->
        <div class="absolute inset-0 opacity-[0.03] bg-[url('https://grainy-gradients.vercel.app/noise.svg')]"></div>
        
        <!-- Gradient Mesh -->
        <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-[1000px] h-[600px] bg-red-500/5 rounded-full blur-[120px] mix-blend-screen"></div>
        <div class="absolute top-0 right-0 w-[800px] h-[600px] bg-[#1c1917] rounded-full blur-[100px]"></div>
    </div>

    <!-- Content -->
    <div class="relative z-10 text-center animate-fade-in-up max-w-lg mx-auto px-4">
        <!-- Big Number Background -->
        <h1 class="text-[12rem] sm:text-[16rem] font-bold text-red-500/5 leading-none select-none absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-[60%] -z-10 font-mono tracking-tighter">
            500
        </h1>
        
        <h2 class="text-4xl font-bold tracking-tight text-white sm:text-5xl mb-6 relative">
            Erro Interno
        </h2>
        
        <div class="max-w-md mx-auto leading-relaxed border-t border-white/5 pt-8">
            <p class="text-lg text-stone-400 mb-2">
                Algo deu errado do nosso lado.
            </p>
            <p class="text-sm text-stone-500 mb-10">
                Nossa equipe de engenharia foi notificada e já está investigando o problema.
            </p>
        </div>

        <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
            <a href="/" class="group flex items-center gap-2 px-6 py-3 rounded-full bg-white/5 border border-white/10 hover:bg-white/10 hover:border-[#a98f71]/30 transition-all duration-300">
                <svg class="w-5 h-5 text-stone-400 group-hover:text-white transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                <span class="text-stone-300 font-medium group-hover:text-white transition-colors">Voltar para Home</span>
            </a>
            

        </div>
    </div>
</div>

<style>
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translate3d(0, 20px, 0);
        }
        to {
            opacity: 1;
            transform: translate3d(0, 0, 0);
        }
    }
    .animate-fade-in-up {
        animation: fadeInUp 0.8s ease-out forwards;
    }
</style>
{% endblock %}
