{% extends "base_dashboard.html" %}

{% block content %}
<div class="max-w-lg mx-auto">
    <div class="bg-white rounded-xl shadow-sm border border-stone-200 overflow-hidden">
        <div class="px-6 py-4 border-b border-stone-100 bg-red-50/50">
            <h2 class="text-xl font-bold text-stone-800 flex items-center">
                <span class="p-2 bg-red-50 rounded-lg mr-3 text-red-600">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z" />
                    </svg>
                </span>
                Confirmar Exclusão
            </h2>
        </div>

        <div class="p-6">
            <p class="text-sm text-stone-600 mb-4">
                Tem certeza que deseja remover <strong>{{ item.name }}</strong>
                (<span class="font-mono">{{ item.phone_number }}</span>) da whitelist?
            </p>
            <p class="text-xs text-stone-500 mb-6">
                Este número voltará a receber respostas automáticas do bot.
            </p>

            <div class="flex gap-3">
                <form method="post" class="flex-1">
                    {{ csrf_input }}
                    <button type="submit"
                        class="w-full inline-flex justify-center items-center rounded-lg bg-red-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-red-700 transition-colors">
                        Sim, Excluir
                    </button>
                </form>
                <a href="{{ url('configuracoes:whitelist') }}"
                    class="flex-1 inline-flex justify-center items-center rounded-lg border border-stone-300 px-4 py-2.5 text-sm font-medium text-stone-700 hover:bg-stone-50 transition-colors">
                    Cancelar
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
