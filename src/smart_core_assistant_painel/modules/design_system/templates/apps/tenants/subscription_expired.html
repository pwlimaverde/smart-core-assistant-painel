{% extends "apps/tenants/base_tenants.html" %}

{% block title %}Assinatura Expirada{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto; text-align: center;">
    <div style="margin-bottom: 1.5rem;">
        <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
    </div>

    <h1 style="color: #ef4444; margin-bottom: 1rem;">Acesso Restrito</h1>
    
    <p style="color: var(--text-secondary); margin-bottom: 1.5rem; font-size: 1.1rem;">
        {{ message }}
    </p>

    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
        <a href="mailto:suporte@smartcore.ai?subject=Renovação de Assinatura" class="btn btn-primary">
            Entrar em Contato
        </a>
        <a href="{{ url('admin:logout') }}" class="btn btn-ghost">
            Fazer Logout
        </a>
    </div>
</div>
{% endblock %}
