<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Smart Core Assistant{% endblock %}</title>

    <!-- Tailwind CSS — compilado pós-modularização -->
    <link rel="stylesheet" href="{{ static_versioned('css/core.build.css') }}">

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>

    <style>
        [x-cloak] { display: none !important; }
    </style>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS (overrides herdados da v1.2.3) -->

    {% block extra_head %}{% endblock %}
</head>

<body class="bg-stone-50 text-stone-900 font-outfit antialiased selection:bg-[#a98f71] selection:text-white">

    {% block layout %}
        {% block navbar %}{% endblock %}

        {% block content %}{% endblock %}

        {% block footer %}{% endblock %}
    {% endblock %}

    {% block extra_scripts %}{% endblock %}
</body>

</html>
