<div 
  x-show="open" 
  class="fixed inset-y-0 right-0 z-40 flex max-w-full pl-10" 
  style="display: none;"
  {{ attrs|safe }}
>
  <div 
    x-show="open"
    x-transition:enter="transform transition ease-in-out duration-300 sm:duration-300"
    x-transition:enter-start="translate-x-full"
    x-transition:enter-end="translate-x-0"
    x-transition:leave="transform transition ease-in-out duration-300 sm:duration-300"
    x-transition:leave-start="translate-x-0"
    x-transition:leave-end="translate-x-full"
    class="w-screen max-w-md"
  >
    <div class="flex flex-col h-full bg-white shadow-xl dark:bg-[var(--ws-card)] border-l border-[var(--ws-border)]">
      <div class="px-4 py-6 sm:px-6 border-b border-[var(--ws-border)] flex items-center justify-between">
        <h2 class="text-lg font-medium text-[var(--ws-fg-strong)]">
          {{ title }}
        </h2>
        <button x-on:click="open = false" class="text-gray-400 hover:text-gray-500">
          <span class="sr-only">Fechar</span>
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div class="relative flex-1 py-6 px-4 sm:px-6 overflow-y-auto">
        {{ content|safe }}
      </div>
    </div>
  </div>
</div>
