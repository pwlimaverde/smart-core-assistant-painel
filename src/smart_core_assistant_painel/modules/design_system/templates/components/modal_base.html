<div 
  x-show="$store.modal.open && $store.modal.name === '{{ name }}'"
  x-on:keydown.escape.window="$store.modal.close()"
  class="fixed inset-0 z-50 overflow-y-auto"
  style="display: none;"
>
  <div class="flex items-end justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:block sm:p-0">
    <!-- Overlay -->
    <div 
      x-show="$store.modal.open && $store.modal.name === '{{ name }}'"
      x-transition:enter="ease-out duration-300"
      x-transition:enter-start="opacity-0"
      x-transition:enter-end="opacity-100"
      x-transition:leave="ease-in duration-200"
      x-transition:leave-start="opacity-100"
      x-transition:leave-end="opacity-0"
      class="fixed inset-0 transition-opacity bg-black bg-opacity-50"
      x-on:click="$store.modal.close()"
    ></div>

    <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

    <!-- Modal Content -->
    <div 
      x-show="$store.modal.open && $store.modal.name === '{{ name }}'"
      x-transition:enter="ease-out duration-300"
      x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
      x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
      x-transition:leave="ease-in duration-200"
      x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
      x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
      class="inline-block px-4 pt-5 pb-4 overflow-hidden text-left align-bottom transition-all transform bg-white rounded-lg shadow-xl dark:bg-[var(--ws-card)] sm:my-8 sm:align-middle sm:max-w-lg sm:w-full sm:p-6 {{ class }}"
    >
      <div class="absolute top-0 right-0 pt-4 pr-4">
        <button 
          x-on:click="$store.modal.close()" 
          class="text-gray-400 bg-white rounded-md dark:bg-transparent hover:text-gray-500 focus:outline-none"
        >
          <span class="sr-only">Fechar</span>
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div>
        {% if title %}
          <h3 class="text-lg font-medium leading-6 text-[var(--ws-fg-strong)]" id="modal-title">
            {{ title }}
          </h3>
        {% endif %}
        <div class="mt-4">
          {{ content|safe }}
        </div>
      </div>
    </div>
  </div>
</div>
